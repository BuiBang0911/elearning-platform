name: Build & Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: edumindacr.azurecr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================
  # 1. BUILD & PUSH IMAGES TO ACR
  # ============================================
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ── Build & Push Backend ──
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./be
          file: ./be/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/edumind-api:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/edumind-api:latest

      # ── Build & Push Frontend ──
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./fe
          file: ./fe/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/edumind-web:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/edumind-web:latest

      # ── Build & Push RAG Service ──
      - name: Build & Push RAG Image
        uses: docker/build-push-action@v6
        with:
          context: ./rag
          file: ./rag/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/edumind-rag:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/edumind-rag:latest

  # ============================================
  # 2. DEPLOY TO AZURE APP SERVICE
  # ============================================
  # Uses Publish Profile per app (no Service Principal needed)
  deploy-api:
    name: Deploy Backend API
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: edumind-api
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          images: ${{ env.ACR_LOGIN_SERVER }}/edumind-api:${{ env.IMAGE_TAG }}

  deploy-rag:
    name: Deploy RAG Service
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: edumind-rag
          publish-profile: ${{ secrets.AZURE_RAG_PUBLISH_PROFILE }}
          images: ${{ env.ACR_LOGIN_SERVER }}/edumind-rag:${{ env.IMAGE_TAG }}

  deploy-web:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: edumind-web
          publish-profile: ${{ secrets.AZURE_WEB_PUBLISH_PROFILE }}
          images: ${{ env.ACR_LOGIN_SERVER }}/edumind-web:${{ env.IMAGE_TAG }}
