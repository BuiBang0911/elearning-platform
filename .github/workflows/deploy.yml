name: Build & Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: edumindacr.azurecr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================
  # 1. BUILD & PUSH IMAGES TO ACR
  # ============================================
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ── Build & Push Backend ──
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./be
          file: ./be/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/edumind-api:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/edumind-api:latest

      # ── Build & Push Frontend ──
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./fe
          file: ./fe/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/edumind-web:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/edumind-web:latest

      # ── Build & Push RAG Service ──
      - name: Build & Push RAG Image
        uses: docker/build-push-action@v6
        with:
          context: ./rag
          file: ./rag/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/edumind-rag:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/edumind-rag:latest

  # ============================================
  # 2. DEPLOY TO AZURE APP SERVICE
  # ============================================
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Deploy Backend API ──
      - name: Deploy Backend to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: edumind-api
          images: ${{ env.ACR_LOGIN_SERVER }}/edumind-api:${{ env.IMAGE_TAG }}

      - name: Set Backend App Settings
        uses: azure/appservice-settings@v1
        with:
          app-name: edumind-api
          app-settings-json: |
            [
              { "name": "ASPNETCORE_ENVIRONMENT", "value": "Production" },
              { "name": "ConnectionStrings__DefaultConnection", "value": "${{ secrets.DB_CONNECTION_STRING }}" },
              { "name": "ConnectionStrings__Redis", "value": "${{ secrets.REDIS_CONNECTION_STRING }}" },
              { "name": "ConnectionStrings__AzureStorage", "value": "${{ secrets.AZURE_STORAGE_CONNECTION }}" },
              { "name": "Jwt__Key", "value": "${{ secrets.JWT_KEY }}" },
              { "name": "Jwt__Issuer", "value": "EduMind" },
              { "name": "Jwt__Audience", "value": "Edumind" },
              { "name": "Jwt__ExpireMinutes", "value": "15" },
              { "name": "AIService__Url", "value": "https://edumind-rag.azurewebsites.net" },
              { "name": "AllowedOrigins", "value": "${{ secrets.ALLOWED_ORIGINS }}" },
              { "name": "AzureConfig__ContainerName", "value": "uploads" },
              { "name": "AzureConfig__BaseUrl", "value": "https://edumindstoragebncb.blob.core.windows.net" },
              { "name": "WEBSITES_PORT", "value": "8080" }
            ]

      # ── Deploy RAG Service ──
      - name: Deploy RAG to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: edumind-rag
          images: ${{ env.ACR_LOGIN_SERVER }}/edumind-rag:${{ env.IMAGE_TAG }}

      - name: Set RAG App Settings
        uses: azure/appservice-settings@v1
        with:
          app-name: edumind-rag
          app-settings-json: |
            [
              { "name": "DATABASE_URL", "value": "${{ secrets.RAG_DATABASE_URL }}" },
              { "name": "GOOGLE_API_KEY", "value": "${{ secrets.GOOGLE_API_KEY }}" },
              { "name": "GOOGLE_API_KEYS", "value": "${{ secrets.GOOGLE_API_KEYS }}" },
              { "name": "WEBSITES_PORT", "value": "8000" }
            ]

      # ── Deploy Frontend ──
      - name: Deploy Frontend to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: edumind-web
          images: ${{ env.ACR_LOGIN_SERVER }}/edumind-web:${{ env.IMAGE_TAG }}

      - name: Azure Logout
        run: az logout
        if: always()
