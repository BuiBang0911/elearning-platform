# =============================================================
# docker-compose.yml — PRODUCTION (Azure App Service)
# =============================================================
# Uses Azure Database for PostgreSQL (external)
# Uses Azure Cache for Redis (external)  
# All secrets via environment variables / .env file
# =============================================================

services:
  # ----------------------------------------------------------------
  # 1. FRONTEND (React + Nginx)
  # ----------------------------------------------------------------
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://edumind-api.azurewebsites.net/api}
    image: ${ACR_LOGIN_SERVER:-edumindacr.azurecr.io}/edumind-web:${IMAGE_TAG:-latest}
    container_name: edumind_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - edumind-network

  # ----------------------------------------------------------------
  # 2. BACKEND (.NET 8 API)
  # ----------------------------------------------------------------
  web:
    build:
      context: ./be
      dockerfile: Dockerfile
    image: ${ACR_LOGIN_SERVER:-edumindacr.azurecr.io}/edumind-api:${IMAGE_TAG:-latest}
    container_name: edumind_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - ConnectionStrings__Redis=${REDIS_CONNECTION_STRING}
      - ConnectionStrings__AzureStorage=${AZURE_STORAGE_CONNECTION}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-EduMind}
      - Jwt__Audience=${JWT_AUDIENCE:-Edumind}
      - Jwt__ExpireMinutes=${JWT_EXPIRE_MINUTES:-15}
      - AIService__Url=http://rag:8000
      - AllowedOrigins=${ALLOWED_ORIGINS:-https://edumind.azurewebsites.net}
      - AzureConfig__ContainerName=${AZURE_CONTAINER_NAME:-uploads}
      - AzureConfig__BaseUrl=${AZURE_STORAGE_BASE_URL:-https://edumindstoragebncb.blob.core.windows.net}
    depends_on:
      rag:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/Course"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - edumind-network

  # ----------------------------------------------------------------
  # 3. RAG SERVICE (Python FastAPI)
  # ----------------------------------------------------------------
  rag:
    build:
      context: ./rag
      dockerfile: Dockerfile
    image: ${ACR_LOGIN_SERVER:-edumindacr.azurecr.io}/edumind-rag:${IMAGE_TAG:-latest}
    container_name: edumind_rag
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${RAG_DATABASE_URL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_API_KEYS=${GOOGLE_API_KEYS}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - edumind-network

  # ----------------------------------------------------------------
  # 4. RAG WORKER (Celery)
  # ----------------------------------------------------------------
  rag-worker:
    build:
      context: ./rag
      dockerfile: Dockerfile
    image: ${ACR_LOGIN_SERVER:-edumindacr.azurecr.io}/edumind-rag:${IMAGE_TAG:-latest}
    container_name: edumind_rag_worker
    restart: always
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      - DATABASE_URL=${RAG_DATABASE_URL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_API_KEYS=${GOOGLE_API_KEYS}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      rag:
        condition: service_healthy
    networks:
      - edumind-network

networks:
  edumind-network:
    driver: bridge